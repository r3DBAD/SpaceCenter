<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860"><rect width="1280" height="860" fill="#fff"/><rect x="383" y="323" width="520" height="270" fill="#bdbdbd"/><rect x="380" y="320" width="520" height="270" fill="#fff" stroke="#000" stroke-width="1.5"/><line x1="380" y1="330" x2="390" y2="320" stroke="#000" stroke-width="1"/><text x="640.0" y="443.0" font-size="13" text-anchor="middle" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="640.0" dy="0">Автоматизировать управление</tspan><tspan x="640.0" dy="15">центром космических пусков</tspan><tspan x="640.0" dy="15">(несколько космодромов)</tspan></text><text x="385" y="585" font-size="10" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="385" dy="0">$0</tspan></text><text x="895" y="585" font-size="12" text-anchor="end" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="895" dy="0">A0</tspan></text><polyline points="0,345 380,345" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="380,345 369,341 369,349" fill="#000"/><text x="3" y="341" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="3" dy="0">I1</tspan></text><text x="36" y="323" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="36" dy="0">Заявки на пуск (тип РН, полезная</tspan><tspan x="36" dy="13">нагрузка, орбита, стартовое окно)</tspan></text><polyline points="0,395 380,395" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="380,395 369,391 369,399" fill="#000"/><text x="3" y="391" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="3" dy="0">I2</tspan></text><text x="36" y="373" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="36" dy="0">Сведения о партиях топлива</tspan><tspan x="36" dy="13">по складам космодромов</tspan></text><polyline points="0,445 380,445" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="380,445 369,441 369,449" fill="#000"/><text x="3" y="441" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="3" dy="0">I3</tspan></text><text x="36" y="423" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="36" dy="0">Фактические метеоданные</tspan><tspan x="36" dy="13">(ветер, t°, облачность, гроза)</tspan></text><polyline points="0,495 380,495" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="380,495 369,491 369,499" fill="#000"/><text x="3" y="491" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="3" dy="0">I4</tspan></text><text x="36" y="473" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="36" dy="0">Телеметрические данные</tspan><tspan x="36" dy="13">по каналам РН</tspan></text><polyline points="0,545 380,545" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="380,545 369,541 369,549" fill="#000"/><text x="3" y="541" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="3" dy="0">I5</tspan></text><text x="36" y="523" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="36" dy="0">Прогноз внешней метеослужбы</tspan><tspan x="36" dy="13">по высотам (за 24 ч до окна)</tspan></text><polyline points="420,100 420,320" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="420,320 416,309 424,309" fill="#000"/><text x="424" y="113" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="424" dy="0">C1</tspan></text><text x="426" y="182" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="426" dy="0">Регламент</tspan><tspan x="426" dy="13">подготовки</tspan><tspan x="426" dy="13">и проведения</tspan><tspan x="426" dy="13">пусков</tspan></text><polyline points="508,100 508,320" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="508,320 504,309 512,309" fill="#000"/><text x="512" y="113" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="512" dy="0">C2</tspan></text><text x="514" y="182" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="514" dy="0">Предельные</tspan><tspan x="514" dy="13">метео-</tspan><tspan x="514" dy="13">условия</tspan></text><polyline points="596,100 596,320" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="596,320 592,309 600,309" fill="#000"/><text x="600" y="113" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="600" dy="0">C3</tspan></text><text x="602" y="182" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="602" dy="0">Нормативы</tspan><tspan x="602" dy="13">площадок</tspan><tspan x="602" dy="13">(лимит,</tspan><tspan x="602" dy="13">циклы ТО)</tspan></text><polyline points="684,100 684,320" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="684,320 680,309 688,309" fill="#000"/><text x="688" y="113" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="688" dy="0">C4</tspan></text><text x="690" y="182" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="690" dy="0">Правила</tspan><tspan x="690" dy="13">учета</tspan><tspan x="690" dy="13">топлива</tspan><tspan x="690" dy="13">(0,1 кг,</tspan><tspan x="690" dy="13">сроки)</tspan></text><polyline points="772,100 772,320" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="772,320 768,309 776,309" fill="#000"/><text x="776" y="113" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="776" dy="0">C5</tspan></text><text x="778" y="182" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="778" dy="0">Права</tspan><tspan x="778" dy="13">по ролям и</tspan><tspan x="778" dy="13">космодро-</tspan><tspan x="778" dy="13">мам, ре-</tspan><tspan x="778" dy="13">гламент</tspan><tspan x="778" dy="13">аудита</tspan></text><polyline points="860,100 860,320" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="860,320 856,309 864,309" fill="#000"/><text x="864" y="113" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="864" dy="0">C6</tspan></text><text x="866" y="182" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="866" dy="0">Регламент</tspan><tspan x="866" dy="13">обмена с</tspan><tspan x="866" dy="13">метео-</tspan><tspan x="866" dy="13">службой</tspan><tspan x="866" dy="13">(24 ч,</tspan><tspan x="866" dy="13">30 с)</tspan></text><polyline points="470,780 470,590" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="470,590 466,601 474,601" fill="#000"/><text x="474" y="776" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="474" dy="0">M1</tspan></text><text x="462" y="640" font-size="11" text-anchor="end" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="462" dy="0">Персонал ЦУП (руководители</tspan><tspan x="462" dy="13">центра и пусков, инженеры,</tspan><tspan x="462" dy="13">метеоролог, оператор ТМ,</tspan><tspan x="462" dy="13">инспектор безопасности)</tspan></text><polyline points="600,780 600,590" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="600,590 596,601 604,601" fill="#000"/><text x="604" y="776" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="604" dy="0">M2</tspan></text><text x="606" y="700" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="606" dy="0">ПО АИС ЦУП</tspan><tspan x="606" dy="13">и СУБД SQLite</tspan></text><polyline points="730,780 730,590" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="730,590 726,601 734,601" fill="#000"/><text x="734" y="776" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="734" dy="0">M3</tspan></text><text x="736" y="640" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="736" dy="0">Внешняя</tspan><tspan x="736" dy="13">метеослужба</tspan><tspan x="736" dy="13">(REST API)</tspan></text><polyline points="850,780 850,590" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="850,590 846,601 854,601" fill="#000"/><text x="854" y="776" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="854" dy="0">M4</tspan></text><text x="856" y="700" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="856" dy="0">Космодромы</tspan><tspan x="856" dy="13">(площадки,</tspan><tspan x="856" dy="13">склады</tspan><tspan x="856" dy="13">топлива)</tspan></text><polyline points="900,345 1280,345" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="1280,345 1269,341 1269,349" fill="#000"/><text x="1277" y="341" font-size="11" text-anchor="end" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="1277" dy="0">O1</tspan></text><text x="930" y="323" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="930" dy="0">Расписание и статусы</tspan><tspan x="930" dy="13">пусков по космодромам</tspan></text><polyline points="900,395 1280,395" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="1280,395 1269,391 1269,399" fill="#000"/><text x="1277" y="391" font-size="11" text-anchor="end" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="1277" dy="0">O2</tspan></text><text x="930" y="373" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="930" dy="0">Журналы нештатных</tspan><tspan x="930" dy="13">ситуаций и переносов</tspan></text><polyline points="900,445 1280,445" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="1280,445 1269,441 1269,449" fill="#000"/><text x="1277" y="441" font-size="11" text-anchor="end" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="1277" dy="0">O3</tspan></text><text x="930" y="423" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="930" dy="0">Отчеты по космодрому</tspan><tspan x="930" dy="13">и сводные</tspan></text><polyline points="900,495 1280,495" fill="none" stroke="#000" stroke-width="1.2"/><polygon points="1280,495 1269,491 1269,499" fill="#000"/><text x="1277" y="491" font-size="11" text-anchor="end" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="1277" dy="0">O4</tspan></text><text x="930" y="473" font-size="11" text-anchor="start" font-weight="normal" font-family="Arial, 'Liberation Sans', sans-serif"><tspan x="930" dy="0">Предупреждения о</tspan><tspan x="930" dy="13">возможном переносе</tspan></text><polyline points="900,545 1280,545" fill="none" stroke=